name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag gamepad-mic-redirect-builder

    - name: Compile the plugin
      run: docker run --rm -v "$GITHUB_WORKSPACE:/project" -w /project gamepad-mic-redirect-builder make

    - name: Copy plugin to TestPlugin.wps
      run: cp GamePadMicRedirect.wps TestPlugin.wps

    - name: Upload compiled plugin
      uses: actions/upload-artifact@v4
      with:
        name: TestPlugin
        path: TestPlugin.wps
        if-no-files-found: error
