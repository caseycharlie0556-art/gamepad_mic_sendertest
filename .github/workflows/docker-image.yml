name: Build Wii U Aroma Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-plugin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build builder Docker image
        run: docker build --file DOCKERBUILD -t gamepad-mic-redirect-builder .

      - name: Compile GamePadMicRedirect.wps
        run: |
          docker run --rm -v "${{ github.workspace }}:/project" gamepad-mic-redirect-builder make

      - name: Package SD card zip
        run: |
          mkdir -p dist/wiiu/environments/aroma/plugins
          cp GamePadMicRedirect.wps dist/wiiu/environments/aroma/plugins/
          cd dist && zip -r ../wiiu.zip wiiu

      - name: Upload GamePadMicRedirect.wps artifact
        uses: actions/upload-artifact@v4
        with:
          name: GamePadMicRedirect-plugin
          path: |
            GamePadMicRedirect.wps
            wiiu.zip
