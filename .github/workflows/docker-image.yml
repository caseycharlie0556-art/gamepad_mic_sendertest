name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)

    - name: Build GamePadMicRedirect.wps
      run: |
        IMAGE_ID=$(docker images -q my-image-name | head -n 1)
        docker run --rm -v "${{ github.workspace }}:/project" "$IMAGE_ID" make

    - name: Upload WPS artifact
      uses: actions/upload-artifact@v4
      with:
        name: GamePadMicRedirect-wps
        path: GamePadMicRedirect.wps
